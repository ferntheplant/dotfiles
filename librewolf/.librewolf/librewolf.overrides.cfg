// LibreWolf reads this file on every start, after its own librewolf.cfg.
// defaultPref() sets a default; a value changed in the UI or about:config still wins.

// Keep cookies and site data (logins) when LibreWolf closes. History is kept by default.
defaultPref("privacy.sanitize.sanitizeOnShutdown", false);

// Open the windows and tabs from the previous session at start (as Floorp did).
defaultPref("browser.startup.page", 3);

// Load chrome/userChrome.css from the profile (hides the horizontal tab strip).
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);

// Allow a Firefox account (Firefox Sync).
defaultPref("identity.fxaccounts.enabled", true);

// Show the per-site WebGL prompt. LibreWolf blocks WebGL on each site until you allow it, and
// hides the prompt by default, so sites such as Google Maps fall back to slow drawing in silence.
defaultPref("librewolf.webgl.prompt.hide", false);

// Use fingerprinting protection (FPP) in place of fingerprint resistance (RFP). RFP always tells
// sites that the theme is light, and it ignores per-feature overrides. FPP with "+AllTargets"
// turns on every RFP protection. "-CSSPrefersColorScheme" then lets sites see the dark theme
// below (CSS prefers-color-scheme).
defaultPref("privacy.resistFingerprinting", false);
defaultPref("privacy.fingerprintingProtection", true);
defaultPref("privacy.fingerprintingProtection.overrides", "+AllTargets,-CSSPrefersColorScheme");

// Always tell sites to use their dark theme, whatever the macOS appearance. This is
// Settings > General > Website appearance: 0 dark, 1 light, 2 automatic (the default).
defaultPref("layout.css.prefers-color-scheme.content-override", 0);

// Turn off all fingerprint protections on Google sites (for Google Maps). With them on, the Maps
// zoom is choppy even with WebGL allowed. FPP ignores privacy.resistFingerprinting.exemptedDomains.
// "firstPartyDomain" is the base domain of the top-level page, so "google.com" includes
// www.google.com.
defaultPref("privacy.fingerprintingProtection.granularOverrides",
  '[{"firstPartyDomain":"google.com","overrides":"-AllTargets"}]');
