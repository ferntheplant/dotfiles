// LibreWolf reads this file on every start, after its own librewolf.cfg.
// defaultPref() sets a default; a value changed in the UI or about:config still wins.

// Keep cookies and site data (logins) when LibreWolf closes. History is kept by default.
defaultPref("privacy.sanitize.sanitizeOnShutdown", false);

// Open the windows and tabs from the previous session at start (as Floorp did).
defaultPref("browser.startup.page", 3);

// Load chrome/userChrome.css from the profile (hides the horizontal tab strip).
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);

// Allow a Firefox account (Firefox Sync).
defaultPref("identity.fxaccounts.enabled", true);
