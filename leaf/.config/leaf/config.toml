watch = true
editor = "hx"

theme = "rose-pine-moon"
extras = ["txt", "json", "yaml", "jsonc", "toml"]

# Colors and semantic roles are cross-referenced against the official Rose Pine
# implementations for the closest analogous tools:
#   https://github.com/rose-pine/vscode (editor chrome: status bar, sidebar, diagnostics)
#   https://github.com/drluckyspin/rose-pine-glow (glow, a terminal markdown reader:
#     headings, links, inline code, blockquotes, emphasis, rules)

[themes.rose-pine-moon]
base = "ocean"
syntax = "base16-ocean.dark"

[themes.rose-pine-moon.ui]
toc_bg = "#232136"
