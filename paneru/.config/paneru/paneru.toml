# Paneru: a niri-style scrolling window manager. Docs:
# https://github.com/karinushka/paneru/blob/main/CONFIGURATION.md
# Saved changes reload at once.
#
# Modifiers: "meh" is ctrl + alt + shift (the kanata @meh key), "hyper" is meh + cmd.
# Paneru matches the left and right modifier bits, which kanata sends.

[options]
focus_follows_mouse = false
mouse_follows_focus = true          # the pointer moves to the window that keyboard focus picks
preset_column_widths = [0.33, 0.5, 0.66, 1.0]
# animation_speed = 14              # 8 to 20 is comfortable; unset means no animation

[swipe.scroll]                      # hold meh and scroll to slide the row freely
modifier = "ctrl + alt + shift"

[swipe.gesture]                     # no fingers_count, so macOS keeps its own gestures
direction = "Reversed"              # in 0.5.2 this also sets the meh-scroll direction

[decorations.active.border]         # experimental in Paneru
enabled = true
color = "#40A02B"
width = 5.0
radius = "auto"

[bindings]
# Focus: left and right move between columns, up and down move in a stack.
window_focus_west = "ctrl + alt + shift - h"
window_focus_south = "ctrl + alt + shift - j"
window_focus_north = "ctrl + alt + shift - k"
window_focus_east = "ctrl + alt + shift - l"
window_focus_managed = "ctrl + alt + shift - tab"   # the window focused before

# Move the focused window in the row.
window_swap_west = "ctrl + alt + shift + cmd - h"
window_swap_south = "ctrl + alt + shift + cmd - j"
window_swap_north = "ctrl + alt + shift + cmd - k"
window_swap_east = "ctrl + alt + shift + cmd - l"

# Jump to column N of the row. The number row and the q-to-o row (the old
# AeroSpace workspace keys) both work. 0 and p jump to the last column.
# Virtual workspaces (more rows) have no bindings: only one row is in use.
window_focus_1 = ["ctrl + alt + shift - 1", "ctrl + alt + shift - q"]
window_focus_2 = ["ctrl + alt + shift - 2", "ctrl + alt + shift - w"]
window_focus_3 = ["ctrl + alt + shift - 3", "ctrl + alt + shift - e"]
window_focus_4 = ["ctrl + alt + shift - 4", "ctrl + alt + shift - r"]
window_focus_5 = ["ctrl + alt + shift - 5", "ctrl + alt + shift - t"]
window_focus_6 = ["ctrl + alt + shift - 6", "ctrl + alt + shift - y"]
window_focus_7 = ["ctrl + alt + shift - 7", "ctrl + alt + shift - u"]
window_focus_8 = ["ctrl + alt + shift - 8", "ctrl + alt + shift - i"]
window_focus_9 = ["ctrl + alt + shift - 9", "ctrl + alt + shift - o"]
window_focus_last = ["ctrl + alt + shift - 0", "ctrl + alt + shift - p"]
window_swap_first = ["ctrl + alt + shift + cmd - 1", "ctrl + alt + shift + cmd - q"]
window_swap_last = ["ctrl + alt + shift + cmd - 0", "ctrl + alt + shift + cmd - p"]

# Size and layout.
window_shrink = "ctrl + alt + shift - minus"
window_grow = "ctrl + alt + shift - equal"
window_fullwidth = "ctrl + alt + shift - slash"
window_center = "ctrl + alt + shift - comma"
window_manage = "ctrl + alt + shift - f"            # toggle floating
window_stack = "ctrl + alt + shift - s"
window_unstack = "ctrl + alt + shift + cmd - s"
window_nextdisplay = "ctrl + alt + shift + cmd - tab"

# Float these apps.
[windows.system_settings]
title = ".*"
bundle_id = "com.apple.systempreferences"
floating = true

[windows.finder]
title = ".*"
bundle_id = "com.apple.finder"
floating = true

[windows.preview]
title = ".*"
bundle_id = "com.apple.Preview"
floating = true

# Settings windows in any app, by title: "Settings", "Preferences", "Ghostty Settings",
# "Settings - Server" (Rex), "Preferences: General". Apps that title the window with only
# the pane name ("General") need their own rule, or meh-f.
[windows.settings]
title = "^(.+ )?(Settings|Preferences)( ?[-–—:] .+)?$"
floating = true

[windows.onepassword]
title = ".*"
bundle_id = "com.1password.1password"
floating = true

# Do not add `role` or `subrole` rules: Paneru 0.5.2 ignores those keys, so
# such a rule matches every window. The keys are only on Paneru's main branch.
