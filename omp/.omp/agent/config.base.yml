modelRoles:
  default: openai-codex/gpt-6.1-sol
setupVersion: 3
enabledProviders:
  - claude
skills:
  enableClaudeUser: true
theme:
  dark: dark-rose-pine
colorBlindMode: true
composer:
  shape: compact-status
  tokenRate: true
statusLine:
  preset: custom
  separator: pipe
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
  showHookStatus: false
  contextLine: off
  leftSegments: []
  rightSegments: []
tui:
  textSizing: true
  reactions: false
  codexResetFireworks: false
  titleSpinner: braille
  maxFps: 30
  tight: false
  motion: full
display:
  showTurnTime: true
  cacheMissMarker: true
  collapseCompacted: false
personality: default
extensionRenderers:
  assistantText: true
images:
  describeForTextModels: false
steeringMode: one-at-a-time
completion:
  notify: "off"
startup:
  quiet: true
  setupWizard: true
  changelogMode: hidden
dev:
  autoqaConsent: denied
