[tools]
bun = "latest"
node = "latest"
python = "3.12"
uv = "latest"
zig = "latest"
rust = "latest"
pnpm = "latest"
go = "latest"
# CLI tools (every machine, the server too)
agent-browser = "latest"
duckdb = "latest"
# fj, the Forgejo CLI. Its releases have no macOS build, so cargo builds it on every machine.
# OPENSSL_STATIC links nanobrew's OpenSSL into the binary: on Linux, /opt/nanobrew/prefix/lib is not
# on the library path, so a dynamically linked fj cannot find libssl when it starts.
"cargo:forgejo-cli" = { version = "latest", install_env = { OPENSSL_STATIC = "1" } }
gitleaks = "latest"
helix = "latest"
just = "latest"
# kvm-pilot, the MCP server that lets agents use the Comet KVM. Its profile is the kvm-pilot stow
# package, and scripts/claude-mcp.sh registers it with Claude Code.
"pypi:kvm-pilot" = "latest"
# Pi, the coding agent. Its config is the pi stow package and scripts/pi-settings.sh.
pi = "latest"
shellcheck = "latest"
yq = "latest"
# Nanobrew installs zmx on macOS. On Linux it installs the macOS binary, so mise installs zmx there.
"github:neurosnap/zmx" = { version = "latest", os = ["linux"] }

[settings]
activate_aggressive = true
experimental = true

trusted_config_paths = ["~/withco/ploutos-worktrees/"]
