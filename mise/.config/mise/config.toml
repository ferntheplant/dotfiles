[tools]
bun = "latest"
node = "latest"
python = "3.12"
uv = "latest"
zig = "latest"
rust = "latest"
pnpm = "latest"
go = "latest"
# CLI tools (every machine, the server too)
agent-browser = "latest"
duckdb = "latest"
gitleaks = "latest"
helix = "latest"
just = "latest"
"aqua:anomalyco/opencode" = "latest"
shellcheck = "latest"
yq = "latest"
# Nanobrew installs zmx on macOS. On Linux it installs the macOS binary, so mise installs zmx there.
"github:neurosnap/zmx" = { version = "latest", os = ["linux"] }

[settings]
activate_aggressive = true
experimental = true

trusted_config_paths = ["~/withco/ploutos-worktrees/"]
