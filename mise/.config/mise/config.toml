[tools]
bun = "latest"
node = "latest"
python = "3.12"
uv = "latest"
zig = "latest"
# rust-analyzer is for Helix and Fresh, which start it
rust = { version = "latest", components = ["rust-analyzer"] }
pnpm = "latest"
go = "latest"
# CLI tools (every machine, the server too)
agent-browser = "latest"
duckdb = "latest"
# fj, the Forgejo CLI. Its releases have no macOS build, so cargo builds it on every machine.
# OPENSSL_STATIC links nanobrew's OpenSSL into the binary: on Linux, /opt/nanobrew/prefix/lib is not
# on the library path, so a dynamically linked fj cannot find libssl when it starts.
"cargo:forgejo-cli" = { version = "latest", install_env = { OPENSSL_STATIC = "1" } }
gitleaks = "latest"
helix = "latest"
just = "latest"
# px0 reads and reviews the diffs that agents write, in a browser. It checks GitHub for a newer
# release on each start and updates its own binary; `mise upgrade` also updates it.
"github:px0-ai/px0" = "latest"
# The language servers and the formatter for JavaScript and TypeScript in Fresh. TypeScript 7 has
# its own language server (`tsc --lsp`).
"npm:oxfmt" = "latest"
"npm:oxlint" = "latest"
"npm:typescript" = "latest"
# px0 and Helix start typescript-language-server for JavaScript and TypeScript. The server needs
# tsserver, which TypeScript 7 does not ship. Its own node_modules gets TypeScript 6, which has
# tsserver, so a project that uses TypeScript 7 keeps its TypeScript. npm installs it after each
# install of the server. The server is a linked package: npm must skip its devDependencies and
# its `prepare` script.
"npm:typescript-language-server" = { version = "latest", depends = ["node"], postinstall = { run = "npm install --prefix \"$MISE_TOOL_INSTALL_PATH\" --omit=dev --ignore-scripts --no-fund --no-audit typescript@6.0.3", when = "always" } }
# kvm-pilot, the MCP server that lets agents use the Comet KVM. Its profile is the kvm-pilot stow
# package, and scripts/claude-mcp.sh registers it with Claude Code.
"pypi:kvm-pilot" = "latest"
shellcheck = "latest"
yq = "latest"
# Nanobrew installs zmx on macOS. On Linux it installs the macOS binary, so mise installs zmx there.
"github:neurosnap/zmx" = { version = "latest", os = ["linux"] }

[settings]
activate_aggressive = true
experimental = true

trusted_config_paths = ["~/withco/ploutos-worktrees/"]
