[time]
format = '\[at [$time]($style)\]'
time_format = '%H:%M:%S'

[custom.command_start_time]
description = "Display the time when the command started running"
command = "cat ~/.cache/starship_command_time 2>/dev/null || echo ''"
when = "test -f ~/.cache/starship_command_time"
format = '\[🕰️ [${output}](bold green)\]'

