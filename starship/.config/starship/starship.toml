[julia]
format = '\[[$symbol]($style)\]'

[kotlin]
format = '\[[$symbol]($style)\]'

[lua]
format = '\[[$symbol]($style)\]'

[memory_usage]
format = '\[$symbol[$ram( | $swap)]($style)\]'

[meson]
format = '\[[$symbol]($style)\]'

[nim]
format = '\[[$symbol]($style)\]'

[nix_shell]
format = '\[[$symbol$state( \($name\))]($style)\]'

[nodejs]
