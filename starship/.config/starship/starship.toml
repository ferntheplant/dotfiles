"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = "rose-pine-dawn"
continuation_prompt = '▶▶ '

[env_var.ZMX_SESSION]
symbol = " "
format = '\[[$symbol$env_value]($style)\]'
description = "zmx session name"
style = "bold blue"

[battery]
disabled = true

# Replace the '❯' symbol in the prompt with '➜'
[character] # The name of the module we are configuring is 'character'
success_symbol = '[➜](bold green)' # The 'success_symbol' segment is being set to '➜' with the color 'bold green'
error_symbol = '[➜](bold red)'

[aws]
format = '\[[$symbol($profile)(\($region\))(\[$duration\])]($style)\]'
symbol = " "

[buf]
format = '\[[$symbol]($style)\]'

[bun]
format = '\[[$symbol]($style)\]'
symbol = '🥟'

[c]
format = '\[[$symbol]($style)\]'
symbol = " "

[cmake]
format = '\[[$symbol]($style)\]'

[cmd_duration]
format = '\[[⏰ $duration]($style)\]'

[cobol]
format = '\[[$symbol]($style)\]'

[conda]
format = '\[[$symbol$environment]($style)\]'
symbol = " "

[crystal]
format = '\[[$symbol]($style)\]'

[daml]
format = '\[[$symbol]($style)\]'

[dart]
format = '\[[$symbol]($style)\]'

[deno]
format = '\[[$symbol]($style)\]'
symbol = "🦕"

[docker_context]
format = '\[[$symbol$context]($style)\]'
detect_folders = ['docker', 'dab']

[dotnet]
format = '\[[$symbol]($style)\]'

[elixir]
format = '\[[$symbol]($style)\]'

[elm]
format = '\[[$symbol]($style)\]'

[erlang]
format = '\[[$symbol]($style)\]'

[fennel]
format = '\[[$symbol]($style)\]'

[fill]
symbol = ' '

[fossil_branch]
format = '\[[$symbol$branch]($style)\]'

[gcloud]
format = '\[[$symbol$project(\($region\))]($style)\]'
symbol = ' '
detect_env_vars = ["GCLOUD_PROJECT"]

[gleam]
format = '\[[$symbol]($style)\]'

[git_branch]
format = '\[[$symbol$branch]($style)\]'
symbol = ' '

[git_status]
format = '([\[$all_status$ahead_behind\]]($style))'
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
modified = '!${count}'

[golang]
format = '\[[$symbol]($style)\]'

[gradle]
format = '\[[$symbol]($style)\]'

[guix_shell]
format = '\[[$symbol]($style)\]'

[haskell]
format = '\[[$symbol]($style)\]'

